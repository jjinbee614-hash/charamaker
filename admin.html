<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CharaMaker — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0a0f; --s1:#13131c; --s2:#1a1a26; --s3:#22222e;
  --border:#2a2a38; --white:#fafafa; --muted:#9ca3af;
  --v:#a78bfa; --p:#f472b6; --g:#34d399; --r:#f87171;
}
* { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family:'DM Sans',sans-serif;
  background:var(--bg); color:var(--white); min-height:100vh;
  padding:2rem 1.5rem;
}
.wrap { max-width:1200px; margin:0 auto; }
h1 { font-family:'Syne',sans-serif; font-size:2rem; font-weight:800; letter-spacing:-.02em; margin-bottom:.3rem; }
.sub { color:var(--muted); margin-bottom:2rem; font-size:.9rem; }

/* Auth gate */
.gate { max-width:420px; margin:5rem auto; padding:2.5rem 2rem; background:var(--s1); border:1px solid var(--border); border-radius:14px; text-align:center }
.gate-title { font-family:'Syne',sans-serif; font-size:1.4rem; font-weight:800; margin-bottom:.4rem; letter-spacing:-.02em }
.gate-sub { color:var(--muted); font-size:.88rem; margin-bottom:1.5rem; line-height:1.5 }
.gate-status { color:var(--r); font-size:.85rem; margin-top:1rem; min-height:1.2em }
.btn-google { display:flex; align-items:center; justify-content:center; gap:.7rem; width:100%; padding:.85rem 1rem; background:#fff; color:#1f1f1f; border:none; border-radius:10px; cursor:pointer; font-family:inherit; font-weight:600; font-size:.95rem; transition:transform .15s }
.btn-google:hover { transform:translateY(-1px) }
.btn-google svg { width:18px; height:18px }

/* Generic buttons */
.btn { padding:.7rem 1.2rem; background:linear-gradient(135deg,var(--v) 0%,var(--p) 100%); border:none; color:#fff; font-family:inherit; font-weight:700; border-radius:8px; cursor:pointer; transition:transform .15s; font-size:.9rem; }
.btn:hover { transform:translateY(-1px); }
.btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }
.btn-ghost { background:transparent; border:1px solid var(--border); color:var(--white); }
.btn-ghost:hover { border-color:var(--v); }
.btn-danger { background:linear-gradient(135deg,#dc2626,#b91c1c); }
.btn-success { background:linear-gradient(135deg,#16a34a,#15803d); }

.tabs { display:flex; gap:.4rem; margin-bottom:1.4rem; border-bottom:1px solid var(--border); }
.tab { padding:.7rem 1.2rem; background:transparent; border:none; color:var(--muted); cursor:pointer; font-family:inherit; font-weight:600; font-size:.88rem; border-bottom:2px solid transparent; }
.tab.active { color:var(--v); border-bottom-color:var(--v); }
.tab:hover { color:var(--white); }

.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:1rem; }
.card { background:var(--s1); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
.card-media { position:relative; aspect-ratio:1/1; background:var(--s3); overflow:hidden; }
.card-media img, .card-media video { width:100%; height:100%; object-fit:cover; display:block; }
.card-meta { padding:.8rem; }
.card-meta-row { display:flex; gap:.5rem; align-items:center; font-size:.7rem; color:var(--muted); margin-bottom:.5rem; }
.card-meta-row b { color:var(--white); font-weight:600; }
.card-prompt { font-size:.78rem; color:var(--muted); margin-bottom:.7rem; line-height:1.4; max-height:3.5em; overflow:hidden; }
.card-actions { display:flex; gap:.4rem; }
.card-actions .btn { flex:1; padding:.5rem; font-size:.78rem; }

.empty { padding:3rem 1rem; text-align:center; color:var(--muted); background:var(--s1); border:1px dashed var(--border); border-radius:12px; }
.loading { padding:2rem; text-align:center; color:var(--muted); }
.toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; gap:1rem; flex-wrap:wrap; }
.toolbar-meta { display:flex; align-items:center; gap:.7rem }
.toolbar-meta .avatar { width:32px; height:32px; border-radius:50%; background:var(--s3); overflow:hidden; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:.85rem; color:var(--muted) }
.toolbar-meta .avatar img { width:100%; height:100%; object-fit:cover }
.toolbar-meta .who { font-size:.8rem; color:var(--muted) }
.toolbar-meta .who b { color:var(--white); font-weight:600 }
.count { font-size:.85rem; color:var(--muted); }

.toast { position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%); background:var(--s2); border:1px solid var(--border); padding:.7rem 1.2rem; border-radius:8px; font-size:.88rem; z-index:1000; opacity:0; transition:opacity .2s; }
.toast.show { opacity:1; }
.toast.err { border-color:var(--r); color:var(--r); }
.toast.ok { border-color:var(--g); color:var(--g); }

.gallery-list-h { font-family:'Syne',sans-serif; font-size:1rem; font-weight:700; margin-bottom:.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
.gallery-list { margin-top:2rem; padding-top:2rem; border-top:1px solid var(--border); }
.gallery-list-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:.6rem; }
.gli { position:relative; aspect-ratio:1/1; background:var(--s3); border-radius:8px; overflow:hidden; }
.gli img, .gli video { width:100%; height:100%; object-fit:cover; }
.gli-rm { position:absolute; top:.3rem; right:.3rem; width:24px; height:24px; border-radius:50%; background:rgba(0,0,0,.7); border:none; color:#fff; cursor:pointer; font-size:.8rem; display:flex; align-items:center; justify-content:center; }
.gli-rm:hover { background:var(--r); }
</style>
</head>
<body>

<!-- ── AUTH GATE ── -->
<div id="gate" class="gate">
  <div class="gate-title">🔐 Admin Console</div>
  <div class="gate-sub">Sign in with your admin Google account.</div>
  <button class="btn-google" onclick="signIn()">
    <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34.5 6.5 29.5 4.5 24 4.5 12.7 4.5 3.5 13.7 3.5 25S12.7 45.5 24 45.5 44.5 36.3 44.5 25c0-1.7-.2-3.3-.5-4.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34.5 6.5 29.5 4.5 24 4.5 16.3 4.5 9.7 8.7 6.3 14.7z"/><path fill="#4CAF50" d="M24 45.5c5.4 0 10.3-2.1 14-5.4l-6.5-5.5C29.6 36 26.9 37 24 37c-5.3 0-9.8-3.4-11.4-8L6 33.7C9.4 39.8 16.2 45.5 24 45.5z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4 5.6l6.5 5.5c-.5.4 6.7-4.9 6.7-14.1 0-1.7-.2-3.3-.5-4.9z"/></svg>
    Sign in with Google
  </button>
  <div class="gate-status" id="gate-status"></div>
</div>

<!-- ── ADMIN PANEL ── -->
<div id="panel" class="wrap" style="display:none">
  <div class="toolbar">
    <div>
      <h1>Showcase Admin</h1>
      <p class="sub">Review user submissions and manage the public gallery.</p>
    </div>
    <div class="toolbar-meta">
      <div class="avatar" id="me-avatar"></div>
      <div class="who" id="me-who"></div>
      <button class="btn btn-ghost" onclick="signOut()">Sign out</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="pending"  onclick="setTab('pending')">⏳ Pending</button>
    <button class="tab"        data-tab="approved" onclick="setTab('approved')">✓ Approved</button>
    <button class="tab"        data-tab="rejected" onclick="setTab('rejected')">— Rejected</button>
    <button class="tab"        data-tab="gallery"  onclick="setTab('gallery')">🖼️ Live gallery</button>
    <button class="tab"        data-tab="credits"  onclick="setTab('credits')">⚡ Credits</button>
  </div>

  <div id="content"><div class="loading">Loading...</div></div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script>
// ── CONFIG ──
if (!window.CONFIG) {
  document.body.innerHTML = '<div style="color:#fff;padding:2rem;font-family:sans-serif">⚠️ config.js missing or failed to load.</div>';
  throw new Error('config.js missing');
}
const SUPABASE_URL = window.CONFIG.SUPABASE_URL;
const SUPABASE_KEY = window.CONFIG.SUPABASE_KEY || window.CONFIG.SUPABASE_ANON_KEY;
const API = window.CONFIG.API;
if (!SUPABASE_URL || !SUPABASE_KEY) {
  document.body.innerHTML = '<div style="color:#fff;padding:2rem;font-family:sans-serif">⚠️ Supabase config missing.</div>';
  throw new Error('Supabase config missing');
}
const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let state = { tab: 'pending', user: null };

// ── AUTH GATE ──
async function signIn() {
  try {
    const { error } = await supa.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + window.location.pathname },
    });
    if (error) throw error;
  } catch (e) {
    setStatus(e.message || 'Sign-in failed', true);
  }
}

async function signOut() {
  await supa.auth.signOut();
  state.user = null;
  document.getElementById('panel').style.display = 'none';
  document.getElementById('gate').style.display = 'block';
  setStatus('');
}

function setStatus(msg, isError) {
  const el = document.getElementById('gate-status');
  if (!el) return;
  el.textContent = msg;
  el.style.color = isError ? 'var(--r)' : 'var(--muted)';
}

function isAdminFromSession(session) {
  return session?.user?.app_metadata?.is_admin === true;
}

async function bootAuth() {
  const { data: { session } } = await supa.auth.getSession();
  if (!session) {
    document.getElementById('gate').style.display = 'block';
    document.getElementById('panel').style.display = 'none';
    return;
  }
  if (!isAdminFromSession(session)) {
    setStatus('Signed in but this account is not an admin.', true);
    document.getElementById('gate').style.display = 'block';
    document.getElementById('panel').style.display = 'none';
    return;
  }
  state.user = session.user;
  showPanel();
}

function showPanel() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('panel').style.display = 'block';

  const meta = state.user.user_metadata || {};
  const name = meta.full_name || meta.name || state.user.email;
  const avatar = meta.avatar_url || meta.picture;
  const initial = (name?.[0] || '?').toUpperCase();

  const av = document.getElementById('me-avatar');
  av.innerHTML = avatar ? `<img src="${avatar}" alt="">` : initial;
  document.getElementById('me-who').innerHTML = `<b>${escapeHtml(name)}</b><br>${escapeHtml(state.user.email || '')}`;

  setTab('pending');
}

supa.auth.onAuthStateChange((_event, session) => {
  if (session) {
    if (isAdminFromSession(session)) {
      state.user = session.user;
      showPanel();
    } else {
      setStatus('This account is not an admin.', true);
    }
  } else {
    state.user = null;
    document.getElementById('panel').style.display = 'none';
    document.getElementById('gate').style.display = 'block';
  }
});

bootAuth();

// ── THUMBNAIL GENERATION ──
async function generateThumbnail(imageUrl, maxDim = 600) {
  try {
    const img = await new Promise((resolve, reject) => {
      const im = new Image();
      im.crossOrigin = 'anonymous';
      im.onload = () => resolve(im);
      im.onerror = () => reject(new Error('thumbnail source load failed'));
      im.src = imageUrl;
    });
    const ratio = Math.min(maxDim / img.width, maxDim / img.height, 1);
    const w = Math.round(img.width * ratio);
    const h = Math.round(img.height * ratio);
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, w, h);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.82));
    if (!blob) throw new Error('canvas.toBlob returned null');
    const fd = new FormData();
    fd.append('file', blob, `thumb_${Date.now()}.jpg`);
    const res = await fetch(`${API}/api/upload`, { method: 'POST', body: fd });
    const data = await res.json();
    if (!data.ok || !data.url) throw new Error(data.error || 'upload failed');
    return data.url;
  } catch (e) {
    console.warn('[thumbnail]', e.message);
    return null;
  }
}

// ── TABS ──
function setTab(tab) {
  state.tab = tab;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  if (tab === 'gallery') loadGallery();
  else if (tab === 'credits') loadCreditsTab();
  else loadSubmissions(tab);
}

// ── CREDITS ADMIN (이메일 포함) ──
async function loadCreditsTab() {
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">Loading users...</div>';

  try {
    // RPC로 admin 전용 데이터 가져오기 (email 포함)
    const { data: credits, error } = await supa.rpc('admin_list_users');
    if (error) throw error;

    // Pull recent transactions for context
    const { data: txs } = await supa
      .from('credit_transactions')
      .select('user_id, delta, reason, created_at')
      .order('created_at', { ascending: false })
      .limit(200);

    if (!credits || !credits.length) {
      content.innerHTML = '<div class="empty">No users found.</div>';
      return;
    }

    // Group transactions by user
    const txByUser = {};
    (txs || []).forEach(t => {
      if (!txByUser[t.user_id]) txByUser[t.user_id] = [];
      txByUser[t.user_id].push(t);
    });

    content.innerHTML = `
      <div class="count">${credits.length} user${credits.length !== 1 ? 's' : ''} · click "+ Grant" to add credits</div>
      <div style="margin-top:1rem;display:flex;flex-direction:column;gap:.7rem">
        ${credits.map(c => renderCreditRow(c, txByUser[c.user_id] || [])).join('')}
      </div>
    `;
  } catch (e) {
    content.innerHTML = `<div class="empty">Error: ${e.message}</div>`;
  }
}

function renderCreditRow(c, recentTxs) {
  const lastTx = recentTxs[0];
  const lastTxText = lastTx ? `Last: ${lastTx.delta > 0 ? '+' : ''}${lastTx.delta} (${lastTx.reason})` : 'No activity';
  const planLabel = (c.plan_name || 'free').toUpperCase();
  const balanceColor = c.credits === 0 ? 'var(--r)' : c.credits < 200 ? 'var(--p)' : 'var(--white)';
  const email = c.email || '(no email)';
  const subStatus = c.subscription_status ? ` · ${c.subscription_status}` : '';
  return `
    <div class="card" style="display:flex;align-items:center;justify-content:space-between;padding:1rem;flex-wrap:wrap;gap:1rem">
      <div style="flex:1;min-width:200px">
        <div style="font-size:.92rem;font-weight:600;color:var(--white);margin-bottom:.2rem">${escapeHtml(email)}</div>
        <div style="font-family:monospace;font-size:.7rem;color:var(--muted);margin-bottom:.3rem">${c.user_id}</div>
        <div style="display:flex;gap:.7rem;align-items:baseline">
          <span style="font-size:1.5rem;font-weight:700;color:${balanceColor};font-family:'Syne',sans-serif">${c.credits.toLocaleString()}</span>
          <span style="font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">${planLabel}${subStatus}</span>
        </div>
        <div style="font-size:.75rem;color:var(--muted);margin-top:.3rem">${lastTxText}</div>
      </div>
      <div style="display:flex;gap:.4rem">
        <button class="btn" onclick="grantCreditsPrompt('${c.user_id}', ${c.credits})">+ Grant</button>
        <button class="btn btn-ghost" onclick="viewUserHistory('${c.user_id}')">History</button>
      </div>
    </div>
  `;
}

async function grantCreditsPrompt(userId, currentBalance) {
  const amt = prompt(`Grant credits to user ${userId.slice(0,8)}...\n(current balance: ${currentBalance.toLocaleString()})\n\nEnter amount (positive number):`, '500');
  if (!amt) return;
  const n = parseInt(amt, 10);
  if (isNaN(n) || n <= 0) { toast('Invalid amount', 'err'); return; }

  try {
    const { error } = await supa.rpc('grant_credits', {
      p_user_id: userId,
      p_amount: n,
      p_reason: 'admin_grant',
      p_ref_id: null,
    });
    if (error) throw error;
    toast(`+${n.toLocaleString()} credits granted ✓`, 'ok');
    loadCreditsTab();
  } catch (e) {
    console.error(e);
    toast('Grant failed: ' + e.message, 'err');
  }
}

async function viewUserHistory(userId) {
  try {
    const { data: txs, error } = await supa
      .from('credit_transactions')
      .select('*')
      .eq('user_id', userId)
      .order('created_at', { ascending: false })
      .limit(50);
    if (error) throw error;

    const html = `
      <div style="background:var(--s2);padding:1rem;border-radius:8px;font-family:monospace;font-size:.8rem;max-height:400px;overflow:auto">
        ${(txs || []).map(t => {
          const sign = t.delta > 0 ? '+' : '';
          const color = t.delta > 0 ? 'var(--g)' : 'var(--r)';
          return `<div style="display:flex;gap:1rem;padding:.4rem 0;border-bottom:1px solid var(--border)">
            <span style="color:var(--muted);min-width:130px">${new Date(t.created_at).toLocaleString()}</span>
            <span style="color:${color};min-width:60px;text-align:right">${sign}${t.delta}</span>
            <span>${t.reason}</span>
          </div>`;
        }).join('')}
      </div>
    `;
    const w = window.open('', '_blank', 'width=600,height=600');
    w.document.write(`<title>${userId}</title><body style="background:#0a0a0f;color:#fff;font-family:sans-serif;padding:1rem">${html}</body>`);
  } catch (e) {
    toast('History failed: ' + e.message, 'err');
  }
}

// ── SUBMISSIONS (pending/approved/rejected) ──
async function loadSubmissions(status) {
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">Loading...</div>';

  let imgs = [], vids = [], chars = [];
  try {
    const r1 = await supa.from('images').select('*').eq('gallery_status', status).order('submitted_at', { ascending: false });
    imgs = r1.data || [];
    const r2 = await supa.from('videos').select('*').eq('gallery_status', status).order('submitted_at', { ascending: false });
    vids = r2.data || [];
    const r3 = await supa.from('characters').select('*').eq('gallery_status', status).order('submitted_at', { ascending: false });
    chars = r3.data || [];
  } catch (e) {
    content.innerHTML = `<div class="empty">Error loading: ${e.message}</div>`;
    return;
  }

  const all = [
    ...imgs.map(i => ({ ...i, _type: 'image' })),
    ...vids.map(v => ({ ...v, _type: 'video' })),
    ...chars.map(c => ({ ...c, _type: 'character' })),
  ].sort((a, b) => new Date(b.submitted_at) - new Date(a.submitted_at));

  if (!all.length) {
    content.innerHTML = `<div class="empty">No ${status} submissions.</div>`;
    return;
  }

  content.innerHTML = `
    <div class="count">${all.length} ${status} submission${all.length !== 1 ? 's' : ''}</div>
    <div class="grid" style="margin-top:1rem">
      ${all.map(it => renderCard(it, status)).join('')}
    </div>
  `;
}

function renderCard(it, status) {
  const isVideo = it._type === 'video';
  const isChar  = it._type === 'character';
  const url = isVideo ? it.video_url : it.image_url;
  const media = isVideo
    ? `<video src="${url}" controls muted playsinline preload="metadata"></video>`
    : `<img src="${url}" alt="">`;

  let actions = '';
  if (status === 'pending') {
    actions = `
      <button class="btn btn-success" onclick="moderate('${it._type}','${it.id}','approved')">✓ Approve</button>
      <button class="btn btn-danger"  onclick="moderate('${it._type}','${it.id}','rejected')">✕ Reject</button>
    `;
  } else if (status === 'approved') {
    actions = `<button class="btn btn-ghost" onclick="moderate('${it._type}','${it.id}','rejected')">Remove from gallery</button>`;
  } else if (status === 'rejected') {
    actions = `<button class="btn btn-success" onclick="moderate('${it._type}','${it.id}','approved')">Approve instead</button>`;
  }

  const submitted = it.submitted_at ? new Date(it.submitted_at).toLocaleString() : '—';
  const label = isVideo ? 'Video' : isChar ? 'Character' : 'Image';
  const subtext = isChar ? (it.name || '') : (it.prompt ? it.prompt.slice(0, 120) + (it.prompt.length > 120 ? '...' : '') : '');

  return `
    <div class="card">
      <div class="card-media">${media}</div>
      <div class="card-meta">
        <div class="card-meta-row"><b>${label}</b> · ${submitted}</div>
        ${subtext ? `<div class="card-prompt">${escapeHtml(subtext)}</div>` : ''}
        <div class="card-actions">${actions}</div>
      </div>
    </div>
  `;
}

async function moderate(type, id, newStatus) {
  const table = type === 'image' ? 'images' : type === 'video' ? 'videos' : 'characters';
  try {
    const { error: e1 } = await supa.from(table).update({ gallery_status: newStatus }).eq('id', id);
    if (e1) throw e1;

    if (newStatus === 'approved') {
      const { data: row } = await supa.from(table).select('*').eq('id', id).single();
      let url = type === 'video' ? row.video_url : row.image_url;

      if (url && !/(?:fal\.media|fal\.ai)/i.test(url)) {
        try {
          toast('Rehosting image to permanent storage...', 'ok');
          const r = await fetch(`${API}/api/rehost-image`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url })
          });
          const d = await r.json();
          if (d.ok && d.url) {
            url = d.url;
            const updateField = type === 'video' ? { video_url: url } : { image_url: url };
            await supa.from(table).update(updateField).eq('id', id);
            console.log('[moderate] rehosted to:', url);
          } else {
            console.warn('[moderate] rehost failed, original URL kept:', d);
          }
        } catch (e) {
          console.warn('[moderate] rehost error:', e.message);
        }
      }

      let thumbnailUrl = null;
      if (type === 'image' || type === 'character') {
        toast('Generating thumbnail...', 'ok');
        thumbnailUrl = await generateThumbnail(url, 600);
      }

      const { data: existing } = await supa
        .from('showcase')
        .select('id')
        .eq('source_type', type)
        .eq('source_id', id)
        .maybeSingle();

      if (!existing) {
        const { error: e2 } = await supa.from('showcase').insert({
          type, url,
          thumbnail_url: thumbnailUrl,
          source_type: type,
          source_id: id,
          user_id: row.user_id,
          is_active: true,
          display_order: 0,
        });
        if (e2) throw e2;
      } else {
        const update = { is_active: true };
        if (thumbnailUrl) update.thumbnail_url = thumbnailUrl;
        await supa.from('showcase').update(update).eq('id', existing.id);
      }
      toast('Approved & added to gallery ✓', 'ok');
    } else {
      await supa.from('showcase').update({ is_active: false })
        .eq('source_type', type).eq('source_id', id);
      toast(newStatus === 'rejected' ? 'Rejected & removed' : 'Updated', 'ok');
    }

    setTab(state.tab);
  } catch (e) {
    console.error('[moderate]', e);
    toast('Action failed: ' + e.message, 'err');
  }
}

// ── LIVE GALLERY ──
async function loadGallery() {
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">Loading gallery...</div>';
  try {
    const { data: items, error } = await supa
      .from('showcase').select('*').eq('is_active', true)
      .order('display_order', { ascending: true })
      .order('created_at', { ascending: false });
    if (error) throw error;

    if (!items || !items.length) {
      content.innerHTML = '<div class="empty">No items in the gallery yet.</div>';
      return;
    }

    const grouped = {
      character: items.filter(i => i.type === 'character'),
      image:     items.filter(i => i.type === 'image'),
      video:     items.filter(i => i.type === 'video'),
    };

    content.innerHTML = ['character', 'image', 'video'].map(t => {
      if (!grouped[t].length) return '';
      const label = t === 'character' ? 'Characters' : t === 'image' ? 'Images' : 'Videos';
      return `
        <div class="gallery-list">
          <div class="gallery-list-h">${label} (${grouped[t].length})</div>
          <div class="gallery-list-grid">
            ${grouped[t].map(it => `
              <div class="gli">
                ${it.type === 'video'
                  ? `<video src="${it.url}" muted playsinline></video>`
                  : `<img src="${it.thumbnail_url || it.url}">`}
                <button class="gli-rm" onclick="removeFromGallery('${it.id}')" title="Remove">✕</button>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }).join('');
  } catch (e) {
    content.innerHTML = `<div class="empty">Error: ${e.message}</div>`;
  }
}

async function removeFromGallery(id) {
  if (!confirm('Remove this item from the public gallery?')) return;
  try {
    const { error } = await supa.from('showcase').update({ is_active: false }).eq('id', id);
    if (error) throw error;
    toast('Removed ✓', 'ok');
    loadGallery();
  } catch (e) {
    toast('Failed: ' + e.message, 'err');
  }
}

// ── HELPERS ──
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg, kind) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + (kind || '') + ' show';
  setTimeout(() => el.classList.remove('show'), 2200);
}
